services:
  authority:
    image: "${ECHO_CLEAN_AUTHORITY_IMAGE:?set ECHO_CLEAN_AUTHORITY_IMAGE to the immutable ECR digest}"
    build: !reset null
    ports: !override
      - name: tunnel-origin
        target: 80
        published: "80"
        host_ip: 127.0.0.1
        protocol: tcp
    logging:
      driver: awslogs
      options:
        awslogs-region: "${ECHO_CLEAN_AWS_REGION:?set ECHO_CLEAN_AWS_REGION to the deployment region}"
        awslogs-group: "${ECHO_CLEAN_AUTHORITY_LOG_GROUP:?set ECHO_CLEAN_AUTHORITY_LOG_GROUP to the provisioned log group}"
        awslogs-stream: "authority"

  proxy:
    volumes:
      - ./Caddyfile.clean-v1.ec2:/etc/caddy/Caddyfile:ro
