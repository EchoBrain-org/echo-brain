services:
  authority:
    image: "${ECHO_CLEAN_AUTHORITY_IMAGE:?set ECHO_CLEAN_AUTHORITY_IMAGE to the immutable ECR digest}"
    build: !reset null
    environment:
      # Select live Atlassian sources only with the fixed staging connector profile.
      ECHO_STAGING_JIRA_ASK_V1: "${ECHO_STAGING_CONNECTOR_REHEARSAL_PROFILE_FILE:+true}"
      ECHO_STAGING_CONFLUENCE_ASK_V1: "${ECHO_STAGING_CONNECTOR_REHEARSAL_PROFILE_FILE:+true}"
      # Off unless the host sets it; the CLI refuses it outside the staging Authority origin.
      ECHO_STAGING_RESEARCH_EVAL_V1: "${ECHO_STAGING_RESEARCH_EVAL_V1:-}"
    ports: !override
      - name: tunnel-origin
        target: 80
        published: "80"
        host_ip: 127.0.0.1
        protocol: tcp
    logging:
      driver: awslogs
      options:
        awslogs-region: "${ECHO_CLEAN_AWS_REGION:?set ECHO_CLEAN_AWS_REGION to the deployment region}"
        awslogs-group: "${ECHO_CLEAN_AUTHORITY_LOG_GROUP:?set ECHO_CLEAN_AUTHORITY_LOG_GROUP to the provisioned log group}"
        awslogs-stream: "authority"

  proxy:
    volumes:
      - ./Caddyfile.clean-v1.ec2:/etc/caddy/Caddyfile:ro
