name: Quick capture
description: Record a small observation for weekly triage without interrupting current work.
labels:
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Capture what you observed; triage will decide priority, ownership, and release timing.

        Do not include credentials, tokens, private user data, or exploitable security details. Use [private vulnerability reporting](https://github.com/EchoBrain-org/echo-brain/security/advisories/new) instead.

  - type: textarea
    id: observation
    attributes:
      label: What did you notice?
      description: Describe the observable problem or concern, not a proposed solution.
      placeholder: While doing ..., I noticed ...
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where did you notice it?
      description: Name the screen, command, workflow, service, file, or operational step.
      placeholder: For example, Mac updater, Authority deployment, or release workflow
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: State the expected outcome if known. It is fine to leave this blank for a preliminary concern.

  - type: dropdown
    id: impact
    attributes:
      label: Potential impact
      description: Choose the closest observation. Triage will assign final priority.
      options:
        - Unsure
        - Minor friction or cleanup
        - Incorrect behavior with a workaround
        - Blocks a workflow or release
        - Risks data integrity or availability
    validations:
      required: true

  - type: input
    id: observed-in
    attributes:
      label: Observed in
      description: Client version, commit SHA, workflow run, or Authority image digest, if known.
      placeholder: Optional

  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence or reproduction
      description: Add concise steps, logs, screenshots, or links after removing secrets and private data.
      placeholder: Optional

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I did not include secrets, credentials, private user data, or exploitable security details.
          required: true
