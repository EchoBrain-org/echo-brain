name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NODE_VERSION: '22.22.1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  macos-launchagent:
    name: macOS arm64 installed lifecycle and LaunchAgent
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install package and exercise the real LaunchAgent
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/echo-brain-package"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir" >/dev/null
          archive_count="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')"
          test "$archive_count" = 1
          archive="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          package_version="$(node -p 'require("./package.json").version')"
          bash .github/scripts/internal-live-macos-smoke.sh \
            "$archive" \
            "$package_version"

  authority-container:
    name: Organization authority container
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build and initialize the authority image
        shell: bash
        run: |
          set -euo pipefail
          deployment="$GITHUB_WORKSPACE/deploy/organization-authority"
          compose="$deployment/compose.yaml"
          data="$deployment/data"
          status_file="$RUNNER_TEMP/authority-status.json"
          duplicate_log="$RUNNER_TEMP/authority-duplicate.log"
          proxy_body="$RUNNER_TEMP/authority-proxy-body"
          test ! -e "$data"
          install -d -m 0700 "$data"
          export ECHO_AUTHORITY_UID="$(id -u)"
          export ECHO_AUTHORITY_GID="$(id -g)"
          export ECHO_AUTHORITY_HOST=localhost
          cleanup() {
            docker compose --file "$compose" down --volumes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --file "$compose" config --quiet
          docker compose --file "$compose" build authority
          docker compose --file "$compose" run --rm --no-deps authority \
            init-development \
            --config /echo/authority.json \
            --state-dir /echo/state \
            --organization-name 'CI Organization'
          docker compose --file "$compose" run --rm --no-deps authority \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              !value.ok ||
              !value.initialized ||
              value.running ||
              value.healthy
            ) {
              throw new Error(`authority stopped status failed: ${JSON.stringify(value)}`);
            }
          ' "$status_file"

          docker run --rm \
            --env ECHO_AUTHORITY_HOST=localhost \
            --env ECHO_PROXY_TOKEN=ci-trusted-proxy-token \
            --env ECHO_PROXY_CLIENT_ID=cid_gS3zlZXMchZuDl7fUj-OTeoaQCMX8ee3CjgdkKkCBcM \
            --volume "$deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker compose --file "$compose" up --detach
          proxy_status=''
          for _ in {1..30}; do
            proxy_status="$(
              curl \
                --connect-timeout 2 \
                --insecure \
                --max-time 2 \
                --output "$proxy_body" \
                --silent \
                --write-out '%{http_code}' \
                https://localhost/admin ||
                true
            )"
            if [[ "$proxy_status" = 303 ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$proxy_status" != 303 ]]; then
            cat "$proxy_body" >&2 || true
            docker compose --file "$compose" logs >&2
            printf 'expected HTTPS /admin to return 303; received %s\n' \
              "$proxy_status" >&2
            exit 1
          fi
          caddy_ca="$RUNNER_TEMP/authority-caddy-root.crt"
          docker compose --file "$compose" exec -T proxy \
            cat /data/caddy/pki/authorities/local/root.crt > "$caddy_ca"
          test "$(
            curl \
              --cacert "$caddy_ca" \
              --connect-timeout 2 \
              --max-time 2 \
              --output /dev/null \
              --silent \
              --write-out '%{http_code}' \
              https://localhost/v1/authority-descriptor
          )" = 200

          docker compose --file "$compose" exec -T authority \
            node services/organization-authority/dist/main.js \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              !value.ok ||
              !value.initialized ||
              !value.running ||
              !value.healthy
            ) {
              throw new Error(`authority live status failed: ${JSON.stringify(value)}`);
            }
          ' "$status_file"

          if docker compose --file "$compose" run --rm --no-deps authority \
            serve --config /echo/authority.json > "$duplicate_log" 2>&1; then
            cat "$duplicate_log" >&2
            echo 'a second authority unexpectedly acquired the shared state' >&2
            exit 1
          fi
          grep -q 'already running for this state directory' "$duplicate_log"

          # A different Compose project name must still resolve the same
          # deployment-stable coordination volume.
          docker compose --project-name authority-alternate \
            --file "$compose" build authority
          if docker compose --project-name authority-alternate \
            --file "$compose" run --rm --no-deps authority \
            serve --config /echo/authority.json > "$duplicate_log" 2>&1; then
            cat "$duplicate_log" >&2
            echo 'an alternate Compose project acquired the same authority state' >&2
            exit 1
          fi
          grep -q 'already running for this state directory' "$duplicate_log"

          docker compose --file "$compose" exec -T authority \
            node services/organization-authority/dist/main.js \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!value.ok || !value.running || !value.healthy) {
              throw new Error(`authority changed after duplicate rejection: ${JSON.stringify(value)}`);
            }
          ' "$status_file"

          docker compose --file "$compose" kill authority
          docker compose --file "$compose" up --detach --force-recreate
          proxy_status=''
          for _ in {1..30}; do
            proxy_status="$(
              curl \
                --connect-timeout 2 \
                --insecure \
                --max-time 2 \
                --output "$proxy_body" \
                --silent \
                --write-out '%{http_code}' \
                https://localhost/admin ||
                true
            )"
            if [[ "$proxy_status" = 303 ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$proxy_status" != 303 ]]; then
            docker compose --file "$compose" logs >&2
            echo 'authority did not recover after forced container death' >&2
            exit 1
          fi
          docker compose --file "$compose" exec -T authority \
            node services/organization-authority/dist/main.js \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!value.ok || !value.running || !value.healthy) {
              throw new Error(`authority forced-death recovery failed: ${JSON.stringify(value)}`);
            }
          ' "$status_file"
