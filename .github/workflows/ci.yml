name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NODE_VERSION: '22.22.1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Documentation proof links are verified against their exact
          # historical commits, not the current worktree alone.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  person-client-package:
    name: macOS arm64 Person-client package
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Pack and exercise the standalone Person client
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/echo-person-client-package"
          mkdir -p "$pack_dir"
          npm run pack:person-client -- "$pack_dir"
          archive_count="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')"
          test "$archive_count" = 1
          archive="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          package_version="$(node -p 'require("./src/product/person-client/package.json").version')"
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = arm64

          archive_list="$RUNNER_TEMP/echo-person-client-archive-files.txt"
          tar -tzf "$archive" > "$archive_list"
          ! grep -Eq '(^|/)services/|(^|/)dist/product/(cli|launchd-service|operator-lifecycle|processing)' "$archive_list"

          prefix="$RUNNER_TEMP/echo-person-client-install"
          person_home="$RUNNER_TEMP/echo-person-client-home"
          stdout_file="$RUNNER_TEMP/echo-person-client-stdout.json"
          stderr_file="$RUNNER_TEMP/echo-person-client-stderr.json"
          mkdir -p "$prefix" "$person_home"
          chmod 700 "$person_home"
          person_home="$(cd "$person_home" && pwd -P)"
          npm install --ignore-scripts --offline --no-audit --no-fund \
            --prefix "$prefix" "$archive"
          cli="$prefix/node_modules/.bin/echo-brain"

          test "$("$cli" --version)" = "$package_version"
          test "$("$cli" --help)" = 'usage: echo-brain person <command> [options]'
          set +e
          HOME="$person_home" "$cli" person records \
            > "$stdout_file" 2> "$stderr_file"
          status="$?"
          set -e
          test "$status" = 1
          test ! -s "$stdout_file"
          test -z "$(find "$person_home" -mindepth 1 -print -quit)"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              value.ok !== false ||
              value.action !== "records" ||
              value.error !== "Person session is unavailable; sign in again"
            ) throw new Error(`unexpected result: ${JSON.stringify(value)}`);
          ' "$stderr_file"

  authority-container:
    name: Organization authority container
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
      - name: Build and exercise the clean V1 authority image
        shell: bash
        run: |
          set -euo pipefail
          deployment="$GITHUB_WORKSPACE/deploy/organization-authority"
          compose="$deployment/compose.clean-v1.yaml"
          data="$deployment/clean-data"
          reset_file="$data/reset.json"
          proxy_body="$RUNNER_TEMP/authority-proxy-body"
          test ! -e "$data"
          install -d -m 0700 "$data"
          export ECHO_CLEAN_AUTHORITY_IMAGE=echo-organization-authority:ci
          export ECHO_CLEAN_AUTHORITY_UID="$(id -u)"
          export ECHO_CLEAN_AUTHORITY_GID="$(id -g)"
          export ECHO_CLEAN_AUTHORITY_HOST=localhost
          cleanup() {
            docker compose --file "$compose" down \
              --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npm run build:authority-image -- "$ECHO_CLEAN_AUTHORITY_IMAGE"
          docker compose --file "$compose" config --quiet
          docker run --rm \
            --env ECHO_CLEAN_AUTHORITY_HOST=localhost \
            --volume "$deployment/Caddyfile.clean-v1:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker compose --file "$compose" run --pull never --rm --no-deps \
            --entrypoint sh authority -ec '
              test -f services/organization-authority/dist/clean-live-main.js
              test -f services/organization-authority/dist/clean-reset-main.js
              test -f services/organization-authority/dist/clean-founder-main.js
              test ! -e services/organization-authority/dist/main.js
              test ! -e services/organization-authority/dist/composition/cli.js
              test -z "$(find packages services -type f \( -name "*.d.ts" -o -name "*.tsbuildinfo" \) -print -quit)"
            '

          docker compose --file "$compose" run --pull never --rm --no-deps \
            --entrypoint node authority \
            services/organization-authority/dist/clean-reset-main.js \
            --state-dir /echo-clean/state \
            --organization-name 'CI Organization' \
            --owner-display-name 'CI Owner' \
            --created-at '2026-08-23T00:00:00.000Z' \
            --artifact-revision "$GITHUB_SHA" > "$reset_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              value.schema_version !== 1 ||
              value.kind !== "echo-organization-authority-clean-reset-state-v1" ||
              value.state_directory !== "/echo-clean/state" ||
              value.manifests?.retrieval_present !== false
            ) {
              throw new Error(`clean reset failed: ${JSON.stringify(value)}`);
            }
          ' "$reset_file"

          docker compose --file "$compose" run --pull never --rm --no-deps -T \
            --entrypoint node --env "GITHUB_SHA=$GITHUB_SHA" \
            authority --input-type=module - <<'NODE'
          import { chmodSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { dirname } from "node:path";
          import { canonicalJson } from "@echo-brain/federation-protocol";

          const reset = JSON.parse(readFileSync("/echo-clean/reset.json", "utf8"));
          const createdAt = "2026-08-23T00:00:00.000Z";
          const state = "/echo-clean/state";
          const privateDirectory = "/echo-clean/private";
          const slackConnectionId = "con_00000000-0000-4000-8000-000000000001";
          function privateFile(path, value) {
            mkdirSync(dirname(path), { recursive: true, mode: 0o700 });
            writeFileSync(path, value, { encoding: "utf8", flag: "wx", mode: 0o600 });
            chmodSync(path, 0o600);
          }
          privateFile(`${privateDirectory}/oidc.json`, `${canonicalJson({
            client_authentication: "client_secret_post",
            client_id: "ci-client",
            id_token_algorithms: ["RS256"],
            issuer: "https://issuer.example.invalid",
            redirect_uri: "https://localhost/v2/session/oidc/callback",
            tenant: { kind: "issuer" },
          })}\n`);
          privateFile(`${privateDirectory}/oidc-client-secret`, "ci-placeholder-client-secret");
          privateFile(`${privateDirectory}/pkce-key`, "A".repeat(43));
          const manifest = {
            schema_version: 1,
            kind: "echo-clean-founder-onboarding-manifest-v1",
            state_directory: state,
            created_at: createdAt,
            artifact_revision: process.env.GITHUB_SHA,
            authority_url: "https://localhost",
            oidc_config_path: `${privateDirectory}/oidc.json`,
            pkce_key_file: `${privateDirectory}/pkce-key`,
            invitation_path: `${state}/onboarding/founder-person-invitation.json`,
            slack_approval_channel_id: "C00000001",
            slack_connection_id: slackConnectionId,
            authority_id: reset.authority_id,
            organization_id: reset.organization_id,
            state_lineage_id: reset.state_lineage_id,
            owner_principal_id: reset.owner_principal_id,
            owner_membership_id: reset.owner_membership_id,
            granola_credential_file: `${privateDirectory}/granola-credential`,
            granola_owner_email_file: `${privateDirectory}/granola-owner-email`,
            llm_credential_file: `${privateDirectory}/llm-credential`,
            setup_seed: {
              authority_id: reset.authority_id,
              organization_id: reset.organization_id,
              state_lineage_id: reset.state_lineage_id,
              owner_principal_id: reset.owner_principal_id,
              owner_membership_id: reset.owner_membership_id,
              control_plane_id: reset.control_plane_id,
              slack_connection_id: slackConnectionId,
            },
            owner_email: "ci-owner@example.test",
            organization_name: "CI Organization",
            owner_display_name: "CI Owner",
          };
          privateFile(
            `${state}/onboarding/clean-founder-v1.json`,
            `${canonicalJson(manifest)}\n`,
          );
          NODE

          docker compose --file "$compose" up \
            --detach --no-build --wait --wait-timeout 90
          docker compose --file "$compose" exec -T authority \
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const expected = JSON.parse(readFileSync("/echo-clean/reset.json", "utf8"));
              const response = await fetch("http://127.0.0.1:39479/v1/authority-descriptor");
              const value = await response.json();
              if (!response.ok || value.authority_descriptor?.authority_id !== expected.authority_id) {
                throw new Error(`unexpected clean Authority descriptor: ${JSON.stringify(value)}`);
              }
            '

          proxy_status=''
          for _ in {1..30}; do
            proxy_status="$(
              curl --connect-timeout 2 --insecure --max-time 2 \
                --output "$proxy_body" --silent --write-out '%{http_code}' \
                https://localhost/v1/authority-descriptor || true
            )"
            [[ "$proxy_status" = 200 ]] && break
            sleep 1
          done
          if [[ "$proxy_status" != 200 ]]; then
            cat "$proxy_body" >&2 || true
            docker compose --file "$compose" logs >&2
            exit 1
          fi
