name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NODE_VERSION: '22.22.1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Documentation proof links are verified against their exact
          # historical commits, not the current worktree alone.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  person-client-package:
    name: macOS arm64 Person-client package
    needs: check
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Pack and exercise the standalone Person client
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/echo-person-client-package"
          mkdir -p "$pack_dir"
          npm run pack:person-client -- "$pack_dir"
          archive_count="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')"
          test "$archive_count" = 1
          archive="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          package_version="$(node -p 'require("./src/product/person-client/package.json").version')"
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = arm64

          archive_list="$RUNNER_TEMP/echo-person-client-archive-files.txt"
          tar -tzf "$archive" > "$archive_list"
          ! grep -Eq '(^|/)services/|(^|/)dist/product/(cli|launchd-service|operator-lifecycle|processing)' "$archive_list"

          prefix="$RUNNER_TEMP/echo-person-client-install"
          person_home="$RUNNER_TEMP/echo-person-client-home"
          stdout_file="$RUNNER_TEMP/echo-person-client-stdout.json"
          stderr_file="$RUNNER_TEMP/echo-person-client-stderr.json"
          mkdir -p "$prefix" "$person_home"
          chmod 700 "$person_home"
          person_home="$(cd "$person_home" && pwd -P)"
          npm install --ignore-scripts --offline --no-audit --no-fund \
            --prefix "$prefix" "$archive"
          cli="$prefix/node_modules/.bin/echo-brain"

          test "$("$cli" --version)" = "$package_version"
          test "$("$cli" --help)" = 'usage: echo-brain person <command> [options]'
          set +e
          HOME="$person_home" "$cli" person recent-decisions \
            > "$stdout_file" 2> "$stderr_file"
          status="$?"
          set -e
          test "$status" = 1
          test ! -s "$stdout_file"
          test -z "$(find "$person_home" -mindepth 1 -print -quit)"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              value.ok !== false ||
              value.action !== "recent-decisions" ||
              value.error !== "Person session is unavailable; sign in again"
            ) throw new Error(`unexpected result: ${JSON.stringify(value)}`);
          ' "$stderr_file"

  authority-container:
    name: Organization authority container
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build and initialize the authority image
        shell: bash
        run: |
          set -euo pipefail
          deployment="$GITHUB_WORKSPACE/deploy/organization-authority"
          compose="$deployment/compose.yaml"
          data="$deployment/data"
          status_file="$RUNNER_TEMP/authority-status.json"
          rebuild_file="$RUNNER_TEMP/authority-readable-search-rebuild.json"
          duplicate_log="$RUNNER_TEMP/authority-duplicate.log"
          proxy_body="$RUNNER_TEMP/authority-proxy-body"
          descriptor_body="$RUNNER_TEMP/authority-descriptor.json"
          test ! -e "$data"
          install -d -m 0700 "$data"
          export ECHO_AUTHORITY_UID="$(id -u)"
          export ECHO_AUTHORITY_GID="$(id -g)"
          export ECHO_AUTHORITY_HOST=localhost
          cleanup() {
            docker compose --file "$compose" down --volumes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker compose --file "$compose" config --quiet
          docker compose --file "$compose" build authority
          docker compose --file "$compose" run --rm --no-deps authority \
            init-development \
            --config /echo/authority.json \
            --state-dir /echo/state \
            --organization-name 'CI Organization'
          # This stopped build crosses the Authority image's complete runtime
          # workspace boundary and opens all three retrieval migration planes.
          # It prevents a selective Docker COPY from passing compilation while
          # omitting a reachable package or its filesystem assets.
          docker compose --file "$compose" run --rm --no-deps authority \
            rebuild-readable-search \
            --config /echo/authority.json > "$rebuild_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              value.schema_version !== 1 ||
              value.kind !== "echo-organization-authority-readable-search-rebuild" ||
              value.record_head_position !== 0 ||
              value.record_head_hash !== null ||
              !/^sha256:[0-9a-f]{64}$/.test(value.generation_id) ||
              !/^sha256:[0-9a-f]{64}$/.test(value.manifest_sha256)
            ) {
              throw new Error(`authority readable-search rebuild failed: ${JSON.stringify(value)}`);
            }
          ' "$rebuild_file"
          docker compose --file "$compose" run --rm --no-deps authority \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              !value.ok ||
              !value.initialized ||
              value.running ||
              value.healthy
            ) {
              throw new Error(`authority stopped status failed: ${JSON.stringify(value)}`);
            }
          ' "$status_file"

          docker run --rm \
            --env ECHO_AUTHORITY_HOST=localhost \
            --env ECHO_PROXY_TOKEN=ci-trusted-proxy-token \
            --env ECHO_PROXY_CLIENT_ID=cid_gS3zlZXMchZuDl7fUj-OTeoaQCMX8ee3CjgdkKkCBcM \
            --volume "$deployment/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          docker compose --file "$compose" up --detach
          proxy_status=''
          for _ in {1..30}; do
            proxy_status="$(
              curl \
                --connect-timeout 2 \
                --insecure \
                --max-time 2 \
                --output "$proxy_body" \
                --silent \
                --write-out '%{http_code}' \
                https://localhost/admin ||
                true
            )"
            if [[ "$proxy_status" = 303 ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$proxy_status" != 303 ]]; then
            cat "$proxy_body" >&2 || true
            docker compose --file "$compose" logs >&2
            printf 'expected HTTPS /admin to return 303; received %s\n' \
              "$proxy_status" >&2
            exit 1
          fi
          caddy_ca="$RUNNER_TEMP/authority-caddy-root.crt"
          docker compose --file "$compose" exec -T proxy \
            cat /data/caddy/pki/authorities/local/root.crt > "$caddy_ca"
          test "$(
            curl \
              --cacert "$caddy_ca" \
              --connect-timeout 2 \
              --max-time 2 \
              --output /dev/null \
              --silent \
              --write-out '%{http_code}' \
              https://localhost/v1/authority-descriptor
          )" = 200

          docker compose --file "$compose" exec -T authority \
            node services/organization-authority/dist/main.js \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              !value.ok ||
              !value.initialized ||
              !value.running ||
              !value.healthy
            ) {
              throw new Error(`authority live status failed: ${JSON.stringify(value)}`);
            }
          ' "$status_file"

          # `proxy` shares the Authority network namespace. Its Compose
          # dependency explicitly propagates a focused Authority restart, so
          # prove that the proxy process is replaced, still targets this
          # Authority container, and can serve the descriptor afterwards.
          proxy_container_before="$(docker compose --file "$compose" ps -q proxy)"
          proxy_pid_before="$(docker inspect --format '{{.State.Pid}}' "$proxy_container_before")"
          test -n "$proxy_container_before"
          test "$proxy_pid_before" != 0

          docker compose --file "$compose" restart authority

          proxy_container_after="$(docker compose --file "$compose" ps -q proxy)"
          proxy_pid_after="$(docker inspect --format '{{.State.Pid}}' "$proxy_container_after")"
          authority_container="$(docker compose --file "$compose" ps -q authority)"
          proxy_network_mode="$(docker inspect --format '{{.HostConfig.NetworkMode}}' "$proxy_container_after")"
          if [[ "$proxy_pid_after" = "$proxy_pid_before" ||
            "$proxy_network_mode" != "container:$authority_container" ]]; then
            docker compose --file "$compose" ps >&2
            docker compose --file "$compose" logs >&2
            printf 'proxy did not restart and rejoin Authority after focused restart (before_pid=%s after_pid=%s network_mode=%s authority=%s)\n' \
              "$proxy_pid_before" "$proxy_pid_after" "$proxy_network_mode" "$authority_container" >&2
            exit 1
          fi

          proxy_status=''
          for _ in {1..30}; do
            proxy_status="$(
              curl \
                --connect-timeout 2 \
                --insecure \
                --max-time 2 \
                --output "$proxy_body" \
                --silent \
                --write-out '%{http_code}' \
                https://localhost/admin ||
                true
            )"
            if [[ "$proxy_status" = 303 ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$proxy_status" != 303 ]] ||
            [[ "$(
              curl \
                --cacert "$caddy_ca" \
                --connect-timeout 2 \
                --max-time 2 \
                --output "$descriptor_body" \
                --silent \
                --write-out '%{http_code}' \
                https://localhost/v1/authority-descriptor
            )" != 200 ]]; then
            docker compose --file "$compose" logs >&2
            echo 'proxy did not serve the Authority descriptor after focused restart' >&2
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const descriptor = value.authority_descriptor;
            if (
              descriptor?.kind !== "echo-organization-authority" ||
              descriptor.schema_version !== 1
            ) {
              throw new Error(`unexpected Authority descriptor after focused restart: ${JSON.stringify(value)}`);
            }
          ' "$descriptor_body"

          if docker compose --file "$compose" run --rm --no-deps authority \
            serve --config /echo/authority.json > "$duplicate_log" 2>&1; then
            cat "$duplicate_log" >&2
            echo 'a second authority unexpectedly acquired the shared state' >&2
            exit 1
          fi
          grep -q 'already running for this state directory' "$duplicate_log"

          # A different Compose project name must still resolve the same
          # deployment-stable coordination volume.
          docker compose --project-name authority-alternate \
            --file "$compose" build authority
          if docker compose --project-name authority-alternate \
            --file "$compose" run --rm --no-deps authority \
            serve --config /echo/authority.json > "$duplicate_log" 2>&1; then
            cat "$duplicate_log" >&2
            echo 'an alternate Compose project acquired the same authority state' >&2
            exit 1
          fi
          grep -q 'already running for this state directory' "$duplicate_log"

          docker compose --file "$compose" exec -T authority \
            node services/organization-authority/dist/main.js \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!value.ok || !value.running || !value.healthy) {
              throw new Error(`authority changed after duplicate rejection: ${JSON.stringify(value)}`);
            }
          ' "$status_file"

          docker compose --file "$compose" kill authority
          docker compose --file "$compose" up --detach --force-recreate
          proxy_status=''
          for _ in {1..30}; do
            proxy_status="$(
              curl \
                --connect-timeout 2 \
                --insecure \
                --max-time 2 \
                --output "$proxy_body" \
                --silent \
                --write-out '%{http_code}' \
                https://localhost/admin ||
                true
            )"
            if [[ "$proxy_status" = 303 ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$proxy_status" != 303 ]]; then
            docker compose --file "$compose" logs >&2
            echo 'authority did not recover after forced container death' >&2
            exit 1
          fi
          docker compose --file "$compose" exec -T authority \
            node services/organization-authority/dist/main.js \
            status --config /echo/authority.json > "$status_file"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!value.ok || !value.running || !value.healthy) {
              throw new Error(`authority forced-death recovery failed: ${JSON.stringify(value)}`);
            }
          ' "$status_file"
