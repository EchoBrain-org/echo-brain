name: product qualification · DEV foundation

on:
  pull_request:
    paths:
      - 'src/product/**'
      - 'src/core/**'
      - 'src/adapters/**'
      - 'src/infrastructure/**'
      - 'src/storage/**'
      - 'src/logging/**'
      - 'src/util/**'
      - 'packages/**'
      - 'services/**'
      - 'product/**'
      - 'provenance/**'
      - 'release/**'
      - 'schemas/meeting-context.v1.schema.json'
      - 'schemas/runtime-config.v1.schema.json'
      - 'schemas/product/**'
      - 'tools/product/**'
      - 'tests/product/**'
      - 'tests/architecture/**'
      - 'tests/core/**'
      - 'tests/adapters/**'
      - 'tests/infrastructure/**'
      - 'tests/integration/**'
      - 'tests/support/**'
      - 'tests/machine/**'
      - 'tests/system/**'
      - 'tools/build.mjs'
      - 'tools/check-boundary.mjs'
      - 'tools/lib/**'
      - 'tools/workspace-source-boundaries.v1.json'
      - 'tools/check-dependencies.mjs'
      - 'tools/check-provenance.mjs'
      - 'tools/check-successor-provenance.mjs'
      - 'tools/organization-authority/**'
      - 'tools/release/**'
      - 'tools/phase5/**'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'tsconfig.workspaces.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'vitest.package.config.ts'
      - 'vitest.product.config.ts'
      - 'tests/README.md'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/product-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'src/product/**'
      - 'src/core/**'
      - 'src/adapters/**'
      - 'src/infrastructure/**'
      - 'src/storage/**'
      - 'src/logging/**'
      - 'src/util/**'
      - 'packages/**'
      - 'services/**'
      - 'product/**'
      - 'provenance/**'
      - 'release/**'
      - 'schemas/meeting-context.v1.schema.json'
      - 'schemas/runtime-config.v1.schema.json'
      - 'schemas/product/**'
      - 'tools/product/**'
      - 'tests/product/**'
      - 'tests/architecture/**'
      - 'tests/core/**'
      - 'tests/adapters/**'
      - 'tests/infrastructure/**'
      - 'tests/integration/**'
      - 'tests/support/**'
      - 'tests/machine/**'
      - 'tests/system/**'
      - 'tools/build.mjs'
      - 'tools/check-boundary.mjs'
      - 'tools/lib/**'
      - 'tools/workspace-source-boundaries.v1.json'
      - 'tools/check-dependencies.mjs'
      - 'tools/check-provenance.mjs'
      - 'tools/check-successor-provenance.mjs'
      - 'tools/organization-authority/**'
      - 'tools/release/**'
      - 'tools/phase5/**'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'tsconfig.workspaces.json'
      - 'eslint.config.js'
      - 'vitest.config.ts'
      - 'vitest.package.config.ts'
      - 'vitest.product.config.ts'
      - 'tests/README.md'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/product-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

# This workflow emits a DEV qualification draft only. It cannot grant human
# attestations, publish a release, or advance maturity by itself.
env:
  PRODUCT_NODE_VERSION: '22.22.1'
  PRODUCT_VERSION: 0.1.0-dev.${{ github.run_number }}

jobs:
  build:
    name: build once · DEV evidence
    # GitHub's macos-14 hosted image is arm64; the job asserts that identity before evidence.
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      bundle_name: ${{ steps.names.outputs.bundle }}
    steps:
      - name: Select exact source SHA
        id: expected
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            printf 'sha=%s\n' '${{ github.event.pull_request.head.sha }}' >> "$GITHUB_OUTPUT"
          else
            printf 'sha=%s\n' '${{ github.sha }}' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.expected.outputs.sha }}
          # check:provenance validates the immutable extraction commit, so the
          # build checkout must retain that ancestry instead of being shallow.
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - name: Pin checked-out identity and target
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = '${{ steps.expected.outputs.sha }}'
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = arm64
          test "$(node -p 'process.versions.node')" = "$PRODUCT_NODE_VERSION"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
      - name: Name immutable run artifacts
        id: names
        shell: bash
        run: printf 'bundle=echo-brain-dev-%s-run-%s\n' '${{ steps.source.outputs.sha }}' '${{ github.run_id }}' >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Repository provenance, dependency, and boundary guards
        id: repository_guards
        continue-on-error: true
        run: npm run check:provenance && npm run check:dependencies && npm run check:boundary
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Repository tests
        id: repo_tests
        continue-on-error: true
        run: npm test -- --reporter=json --outputFile="$RUNNER_TEMP/repository-results.json"
      - name: Prepare exact offline dependencies
        id: prepare
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/qualification-bundle"
          mkdir -p "$bundle"
          node tools/product/prepare-offline-deps.mjs \
            --out-dir "$bundle/qualification-support" \
            --cache-source "$GITHUB_WORKSPACE/.npm-cache"
      - name: Build product artifact exactly once
        id: builder
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node tools/product/build-artifact.mjs \
            --version "$PRODUCT_VERSION" \
            --source-sha '${{ steps.source.outputs.sha }}' \
            --out-dir "$RUNNER_TEMP/qualification-bundle/artifact"
          printf 'ECHO_PRODUCT_ARTIFACT_DIR=%s\n' "$RUNNER_TEMP/qualification-bundle/artifact" >> "$GITHUB_ENV"
      - name: Product boundary check
        id: boundary
        continue-on-error: true
        run: node tools/product/check-boundary.mjs --output "$RUNNER_TEMP/product-closure.json"
      - name: Product tests against the built artifact
        id: product_tests
        continue-on-error: true
        run: npm run test:qualification -- --reporter=json --outputFile="$RUNNER_TEMP/product-results.json"
      - name: Count unexpected repository and product-test skips
        id: skips
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/product-results.json" && -f "$RUNNER_TEMP/repository-results.json" ]]; then
            count="$(node -e "const a=require(process.argv[1]);const b=require(process.argv[2]);process.stdout.write(String((a.numPendingTests ?? 0) + (b.numPendingTests ?? 0)))" "$RUNNER_TEMP/product-results.json" "$RUNNER_TEMP/repository-results.json")"
          else
            count=1
          fi
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
      - name: Verify artifact and support hashes
        id: verify
        continue-on-error: true
        run: >-
          node tools/product/verify-bundle.mjs
          --artifact-dir "$RUNNER_TEMP/qualification-bundle/artifact"
          --support-dir "$RUNNER_TEMP/qualification-bundle/qualification-support"
      - name: Create honest DEV draft
        id: draft
        if: always() && steps.builder.outcome == 'success'
        shell: bash
        run: |
          boundary_status=fail
          product_status=fail
          [[ '${{ steps.boundary.outcome }}' == success ]] && boundary_status=pass
          [[ '${{ steps.product_tests.outcome }}' == success ]] && product_status=pass
          node tools/product/create-draft-report.mjs \
            --artifact-manifest "$RUNNER_TEMP/qualification-bundle/artifact/artifact-manifest.json" \
            --matrix "$GITHUB_WORKSPACE/schemas/product/qualification-matrix.v1.json" \
            --output "$RUNNER_TEMP/qualification-bundle/draft-report.json" \
            --capability-id team-meeting-to-brief \
            --spec-id standalone-product-qualification-v1 \
            --ci-run-id '${{ github.run_id }}' \
            --ci-run-attempt '${{ github.run_attempt }}' \
            --ci-workflow product-qualification \
            --boundary-status "$boundary_status" \
            --product-test-status "$product_status" \
            --unexpected-skip-count '${{ steps.skips.outputs.count }}'
          node tools/product/validate-qualification.mjs \
            --report "$RUNNER_TEMP/qualification-bundle/draft-report.json" \
            --artifact-manifest "$RUNNER_TEMP/qualification-bundle/artifact/artifact-manifest.json"
      - name: Upload immutable build bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.names.outputs.bundle }}
          path: ${{ runner.temp }}/qualification-bundle
          if-no-files-found: error
          retention-days: 14
      - name: Build-job terminal status
        if: always()
        shell: bash
        run: |
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.repository_guards.outcome }}' = success
          test '${{ steps.lint.outcome }}' = success
          test '${{ steps.repo_tests.outcome }}' = success
          test '${{ steps.prepare.outcome }}' = success
          test '${{ steps.builder.outcome }}' = success
          test '${{ steps.boundary.outcome }}' = success
          test '${{ steps.product_tests.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
          test '${{ steps.skips.outputs.count }}' = 0

  target:
    name: macOS arm64 · Node 22 · install smoke · no checkout
    needs: build
    if: always() && needs.build.outputs.bundle_name != ''
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
      - name: Download exact build bundle
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: ${{ runner.temp }}/qualification-bundle
      - name: Verify exact bytes before install
        id: verify
        continue-on-error: true
        run: >-
          node "$RUNNER_TEMP/qualification-bundle/qualification-support/verify-bundle.mjs"
          --artifact-dir "$RUNNER_TEMP/qualification-bundle/artifact"
          --support-dir "$RUNNER_TEMP/qualification-bundle/qualification-support"
      - name: Run the shipped installer, packaged selftests, onboarding/init, and isolation smoke
        id: target_cell
        continue-on-error: true
        run: >-
          node "$RUNNER_TEMP/qualification-bundle/qualification-support/run-target-cell.mjs"
          --artifact-dir "$RUNNER_TEMP/qualification-bundle/artifact"
          --support-dir "$RUNNER_TEMP/qualification-bundle/qualification-support"
          --work-dir "$RUNNER_TEMP/target-work"
          --evidence "$RUNNER_TEMP/target-evidence/target-evidence.json"
      - name: Upload immutable target evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-brain-target-${{ needs.build.outputs.source_sha }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/target-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Target terminal status
        if: always()
        shell: bash
        run: |
          test '${{ steps.download.outcome }}' = success
          test '${{ steps.verify.outcome }}' = success
          test '${{ steps.target_cell.outcome }}' = success

  aggregate:
    name: aggregate DEV report · no checkout
    needs: [build, target]
    if: always() && needs.build.outputs.bundle_name != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
      - name: Download exact build bundle
        id: bundle
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: ${{ runner.temp }}/qualification-bundle
      - name: Download target evidence
        id: target_evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: echo-brain-target-${{ needs.build.outputs.source_sha }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/target-evidence
      - name: Aggregate immutable evidence into a new DEV report
        id: aggregate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/final-report"
          printf '{"build":"%s","target":"%s"}\n' '${{ needs.build.result }}' '${{ needs.target.result }}' > "$RUNNER_TEMP/dependency-results.json"
          node "$RUNNER_TEMP/qualification-bundle/qualification-support/aggregate-evidence.mjs" \
            --draft-report "$RUNNER_TEMP/qualification-bundle/draft-report.json" \
            --target-evidence "$RUNNER_TEMP/target-evidence/target-evidence.json" \
            --dependency-results "$RUNNER_TEMP/dependency-results.json" \
            --artifact-manifest "$RUNNER_TEMP/qualification-bundle/artifact/artifact-manifest.json" \
            --schema "$RUNNER_TEMP/qualification-bundle/qualification-support/schemas/product/qualification-report.v1.schema.json" \
            --matrix "$RUNNER_TEMP/qualification-bundle/qualification-support/schemas/product/qualification-matrix.v1.json" \
            --output "$RUNNER_TEMP/final-report/qualification-report.json" \
            --terminal-output "$RUNNER_TEMP/final-report/terminal-status.json"
          node "$RUNNER_TEMP/qualification-bundle/qualification-support/validate-qualification.mjs" \
            --report "$RUNNER_TEMP/final-report/qualification-report.json" \
            --artifact-manifest "$RUNNER_TEMP/qualification-bundle/artifact/artifact-manifest.json" \
            --schema "$RUNNER_TEMP/qualification-bundle/qualification-support/schemas/product/qualification-report.v1.schema.json" \
            --matrix "$RUNNER_TEMP/qualification-bundle/qualification-support/schemas/product/qualification-matrix.v1.json"
      - name: Upload immutable final DEV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-brain-final-report-${{ needs.build.outputs.source_sha }}-run-${{ github.run_id }}
          path: ${{ runner.temp }}/final-report
          if-no-files-found: error
          retention-days: 14
      - name: Final terminal gate
        if: always()
        run: >-
          node "$RUNNER_TEMP/qualification-bundle/qualification-support/terminal-gate.mjs"
          --terminal-status "$RUNNER_TEMP/final-report/terminal-status.json"
