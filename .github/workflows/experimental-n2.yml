name: experimental N=2 reference · informational

on:
  pull_request:
    paths:
      - 'src/experimental/**'
      - 'tests/experimental/**'
      - 'src/product/**'
      - 'src/infrastructure/**'
      - 'src/util/**'
      - 'tests/product/federation/fixtures/**'
      - 'tests/product/setup.ts'
      - 'packages/**'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - 'tsconfig.experimental.json'
      - 'tsconfig.build.json'
      - 'tsconfig.workspaces.json'
      - 'eslint.config.js'
      - 'vitest.experimental.config.ts'
      - '.github/workflows/experimental-n2.yml'
  push:
    branches: [main]
    paths:
      - 'src/experimental/**'
      - 'tests/experimental/**'
      - 'src/product/**'
      - 'src/infrastructure/**'
      - 'src/util/**'
      - 'tests/product/federation/fixtures/**'
      - 'tests/product/setup.ts'
      - 'packages/**'
      - 'package.json'
      - 'npm-shrinkwrap.json'
      - 'tsconfig.experimental.json'
      - 'tsconfig.build.json'
      - 'tsconfig.workspaces.json'
      - 'eslint.config.js'
      - 'vitest.experimental.config.ts'
      - '.github/workflows/experimental-n2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NODE_VERSION: '22.22.1'

jobs:
  check:
    name: frozen reference check (non-blocking)
    runs-on: macos-14
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check:experimental
