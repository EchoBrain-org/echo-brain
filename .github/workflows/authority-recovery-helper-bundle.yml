name: authority recovery helper bundle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_NODE_VERSION: "22.22.1"

jobs:
  bundle:
    name: Build offline recovery helper bundle
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.PRODUCT_NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build and exercise the immutable Linux ARM64 bundle
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(node --version)" = "v$PRODUCT_NODE_VERSION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          archive="$RUNNER_TEMP/echo-authority-recovery-helper-$GITHUB_SHA.tar.gz"
          node tools/build-authority-recovery-helper-bundle.mjs \
            --source-root "$GITHUB_WORKSPACE" \
            --output "$archive"
          test -s "$archive"
          test -s "$archive.manifest.json"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (
              value.schema_version !== 1 ||
              value.kind !== "echo-authority-recovery-helper-bundle-v1" ||
              value.source_commit !== process.env.GITHUB_SHA ||
              value.node_version !== `v${process.env.PRODUCT_NODE_VERSION}` ||
              value.platform !== "linux" ||
              value.architecture !== "arm64" ||
              !/^[0-9a-f]{64}$/.test(value.npm_shrinkwrap_sha256) ||
              !/^[0-9a-f]{64}$/.test(value.archive_sha256)
            ) throw new Error("unexpected recovery-helper bundle manifest");
          ' "$archive.manifest.json"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
      - name: Upload the reviewed bundle and receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authority-recovery-helper-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.archive }}.manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
